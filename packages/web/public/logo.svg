<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Tendon">
  <!-- Outer double stroke: "t" with curl on top and hook at bottom -->
  <g stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left (outer) stem: curl at top -> down -> hook right at bottom -->
    <path d="
      M 22 18
      C 20 15.5, 21.5 12, 25 12
      C 28.5 12, 30 15.5, 28 18
      L 28 45
      C 28 51, 33 54, 38 52
    " />
    <!-- Right (inner) stem: starts from top crossbar, parallel down, joins hook -->
    <path d="
      M 34 18
      L 34 45
      C 34 49, 36.5 51, 40 50
    " />
    <!-- Crossbar -->
    <path d="M 18 22 L 44 22" />
  </g>
</svg>
